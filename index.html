<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        canvas { background: #f4f4f4; display: block; margin: auto; }
    </style>
</head>
<body>
    <h1>Juego del Dinosaurio</h1>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let dino = { x: 50, y: 150, width: 30, height: 30, vy: 0, gravity: 1, jumping: false };
        let obstacles = [];
        let gameOver = false;
        let score = 0;
        
        const dinoImage = new Image();
        dinoImage.src = "img/rana.png" ; // Reemplaza con la ruta de tu personaje PNG
        
        const mushroomImage = new Image();
        mushroomImage.src = "img/hongo.png"; // Reemplaza con la ruta de la imagen de hongo
        
        function drawDino() {
            ctx.drawImage(dinoImage, dino.x, dino.y, dino.width, dino.height);
        }
        
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.drawImage(mushroomImage, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }
        
        function update() {
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawDino();
            drawObstacles();
            
            dino.y += dino.vy;
            dino.vy += dino.gravity;
            if (dino.y > 150) {
                dino.y = 150;
                dino.jumping = false;
            }
            
            obstacles.forEach(obstacle => {
                obstacle.x -= 5;
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.shift();
                    score++;
                }
                if (dino.x < obstacle.x + obstacle.width && dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height && dino.y + dino.height > obstacle.y) {
                    gameOver = true;
                    alert("Game Over! Puntuación: " + score);
                }
            });
            requestAnimationFrame(update);
        }
        
        function jump() {
            if (!dino.jumping) {
                dino.vy = -15;
                dino.jumping = true;
            }
        }
        
        function spawnObstacle() {
            if (!gameOver) {
                obstacles.push({ x: canvas.width, y: 150, width: 30, height: 30 });
                setTimeout(spawnObstacle, Math.random() * 2000 + 1000);
            }
        }
        
        document.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        spawnObstacle();
        update();
    </script>
</body>
</html>
